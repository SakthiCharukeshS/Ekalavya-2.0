<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ekalavya 2.0 — Tech Stack</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #ffffff;
    font-family: 'Segoe UI', Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 40px;
  }
  .container {
    display: flex;
    flex-direction: column;
    gap: 40px;
    align-items: center;
  }
  .row {
    display: flex;
    gap: 50px;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
  }
  .tech {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    width: 100px;
  }
  .tech img {
    width: 64px;
    height: 64px;
    object-fit: contain;
  }
  .tech span {
    font-size: 13px;
    font-weight: 600;
    color: #334155;
    text-align: center;
    line-height: 1.2;
  }
</style>
</head>
<body>
<div class="container">

  <!-- Row 1: Frontend & Protocol -->
  <div class="row">
    <div class="tech">
      <img src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/react/react-original.svg" alt="React">
      <span>React</span>
    </div>
    <div class="tech">
      <img src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/vitejs/vitejs-original.svg" alt="Vite">
      <span>Vite</span>
    </div>
    <div class="tech">
      <img src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/typescript/typescript-original.svg" alt="TypeScript">
      <span>TypeScript</span>
    </div>
    <div class="tech">
      <img src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/tailwindcss/tailwindcss-original.svg" alt="Tailwind CSS">
      <span>Tailwind CSS</span>
    </div>
    <div class="tech">
      <img src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/vscode/vscode-original.svg" alt="Monaco Editor">
      <span>Monaco Editor</span>
    </div>
    <div class="tech">
      <img src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/nodejs/nodejs-original.svg" alt="Node.js">
      <span>Node.js</span>
    </div>
  </div>

  <!-- Row 2: AI, Database & Infra -->
  <div class="row">
    <div class="tech">
      <img src="https://raw.githubusercontent.com/pheralb/svgl/main/static/library/groq.svg" alt="Groq">
      <span>Groq</span>
    </div>
    <div class="tech">
      <img src="https://raw.githubusercontent.com/pheralb/svgl/main/static/library/meta.svg" alt="Llama">
      <span>Llama 3.3</span>
    </div>
    <div class="tech">
      <img src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/sqlite/sqlite-original.svg" alt="SQLite">
      <span>SQLite</span>
    </div>
    <div class="tech">
      <img src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/prisma/prisma-original.svg" alt="Prisma">
      <span>Prisma</span>
    </div>
    <div class="tech">
      <img src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/framermotion/framermotion-original.svg" alt="Framer Motion"
           onerror="this.onerror=null; this.src='https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/framermotion/framermotion-original-wordmark.svg';">
      <span>Framer Motion</span>
    </div>
    <div class="tech">
      <img src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/zustand/zustand-original.svg" alt="Zustand"
           onerror="this.onerror=null; this.src='https://raw.githubusercontent.com/pmndrs/zustand/main/bear.jpg';">
      <span>Zustand</span>
    </div>
  </div>

</div>
</body>
</html>
